name: Release

# Creates a GitHub Release with pre-built binaries when a new tag is pushed.
#
# Usage:
#   git tag v4.5.0
#   git push origin v4.5.0
#
# This workflow will:
# - Build for Windows, Linux and macOS using the project's build scripts
# - Create a **Draft Release** (you must manually publish it)
# - Attach platform-specific .zip / .tar.gz packages
# - Generate SHA256 checksums (checksums.txt)
#
# Trigger: Push a tag starting with "v" (e.g. v4.5.0)

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.27.4'

jobs:
  # ============================================================
  # Build binaries for Windows
  # ============================================================
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download ripgrep binaries for embed_rg
        shell: bash
        run: bash embed/ripgrep/download.sh

      - name: Build all Windows amd64 binaries
        if: matrix.goarch == 'amd64'
        run: .\build-windows.bat

      - name: Build Windows arm64 binaries
        if: matrix.goarch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          pkg=github.com/mcp/filesystem-ultra/internal/mcpserver
          flags="-s -w -X $pkg.BuildCommit=$(git rev-parse --short HEAD) -X $pkg.BuildDate=$(date +%Y-%m-%d)"
          go build -trimpath -ldflags "$flags" -o bin/filesystem-ultra-v4.exe ./cmd/filesystem-ultra
          cp bin/filesystem-ultra-v4.exe bin/filesystem-ultra.exe
          go build -trimpath -ldflags "$flags" -o bin/mcp-proxy.exe ./cmd/proxy
          go build -trimpath -ldflags "$flags" -o bin/filesystem-ultra-v4-dashboard.exe ./cmd/dashboard

      - name: Package Windows release
        run: |
          # Include release instructions. The checkout root is the workspace, not its parent.
          Copy-Item release\README.txt bin\README.txt -Force
          cd bin
          Compress-Archive -Path * -DestinationPath ..\filesystem-ultra-${{ github.ref_name }}-windows-${{ matrix.goarch }}.zip -Force
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-${{ matrix.goarch }}-${{ github.ref_name }}
          path: |
            filesystem-ultra-${{ github.ref_name }}-windows-${{ matrix.goarch }}.zip
          retention-days: 30

  # ============================================================
  # Build binaries for Linux and macOS (amd64 and arm64)
  # ============================================================
  build-unix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download ripgrep binaries for embed_rg
        run: bash embed/ripgrep/download.sh

      - name: Build target binaries
        run: |
          chmod +x build-windows.sh
          ./build-windows.sh

      - name: Package target release
        run: |
          # Include release instructions. The checkout root is the workspace, not its parent.
          cp release/README.txt bin/README.txt
          cd bin
          tar -czvf ../filesystem-ultra-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz .

      - name: Upload target artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}
          path: |
            filesystem-ultra-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          retention-days: 30

  # ============================================================
  # Create GitHub Release and attach all binaries
  # ============================================================
  create-release:
    needs: [build-windows, build-unix]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required to create releases

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" \) | sort

      # Generate SHA256 checksums for all release assets
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" \) -exec sha256sum {} + | sort > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true                    # Created as draft so you can review before publishing
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          body: |
            ## Binaries

            This release includes pre-built binaries for:

            - **Windows** (`amd64`, `arm64`)
            - **Linux** (`amd64`, `arm64`)
            - **macOS** (`amd64`, `arm64`)

            Windows arm64 uses the standard server (install ripgrep separately for accelerated search).
            Other targets also include the `embed_rg` variant.

            **Recommended downloads:**
            - `filesystem-ultra-*-windows-*.zip`
            - `filesystem-ultra-*-linux-*.tar.gz`
            - `filesystem-ultra-*-darwin-*.tar.gz`

            Each archive contains a `README.txt` with quick start instructions for Claude Desktop.

            See `checksums.txt` for SHA256 hashes of all files.
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.exe
            artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "✅ Draft release ${{ github.ref_name }} created successfully."
          echo "Review and publish it manually from the GitHub Releases page."